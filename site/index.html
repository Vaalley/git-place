<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>git-place</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main>
  <h1>git-place</h1>
  <canvas id="board" width="640" height="640"></canvas>
  <div id="palette"></div>
  <div id="controls">
    <label>peer id <input id="peer" maxlength="64" size="14"></label>
    <div class="row">
      <button id="hostBtn">Host session</button>
      <button id="joinBtn">Join session</button>
      <button id="acceptBtn">Accept answer</button>
    </div>
    <textarea id="offerBox" rows="4" placeholder="offer blob — host copies this out; guest pastes the host offer here, then 'Join session'"></textarea>
    <textarea id="answerBox" rows="4" placeholder="answer blob — guest copies this out; host pastes it here, then 'Accept answer'"></textarea>
    <button id="publishBtn" disabled>Publish 0 pixels</button>
    <div id="status" role="status"></div>
  </div>
  <p><a href="../README.md">README</a></p>
</main>
<script type="module" src="./client.js"></script>
</body>
</html>
